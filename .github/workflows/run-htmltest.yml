name: Run htmltest over rendered content
on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  htmltest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare cached build
        id: build
        uses: ./.github/actions/prepare-build

      - name: Check internal HTML
        run: make -o build html-check

      - name: Check archive corruption and diagnostic tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make -o build standards-test check-tests

      - name: Check rendered navigation and downloads
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make -o build site-check

      - name: Check external links (advisory)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: make -o build html-check-external

      - name: Archive htmltest results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: htmltest-report
          path: tmp/checks/
          include-hidden-files: true
          retention-days: 5
