name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_CACHE_HOST_DIR: ./.hugo_cache
      HUGO_CACHE_CONTAINER_DIR: /src/.hugo_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Generate Hugo data from BibTeX
        run: |
          mkdir -p data
          uv run .github/scripts/bibtex_to_json.py \
            --input assets/bibliographies/publications.bib \
            --output data/publications.json

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.HUGO_CACHE_HOST_DIR }}
          key: hugo-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            hugo-${{ runner.os }}-

      - name: Build in Docker Compose
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          BUILD_TIMESTAMP_UTC="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          docker compose build --pull hugo
          docker compose run --rm --no-deps \
            --entrypoint sh \
            --user "$(id -u):$(id -g)" \
            -e HUGO_CACHEDIR="${HUGO_CACHE_CONTAINER_DIR}" \
            -e BASE_URL="${BASE_URL}" \
            -e BUILD_TIMESTAMP_UTC="${BUILD_TIMESTAMP_UTC}" \
            hugo -c '.github/scripts/build-site.sh'

      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.HUGO_CACHE_HOST_DIR }}
          key: hugo-${{ runner.os }}-${{ github.run_id }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5